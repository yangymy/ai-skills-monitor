name: AI Skills Daily Monitor

on:
  schedule:
    - cron: '0 6,12,18 * * *'  # 每天6点、12点、18点执行(UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式(只输出到控制台,不发送邮件)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: data/
          key: skills-data-${{ github.run_id }}
          restore-keys: |
            skills-data-
      
      - name: Run skill monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python src/monitor.py
      
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            reports/*.html
            reports/*.json
            data/skills.db
        retention-days: 30
      
      - name: Commit data updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Update skills data - $(date +%Y-%m-%d)"
          git push || echo "No changes to commit"
        continue-on-error: true
      
      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports
